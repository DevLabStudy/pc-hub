<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% if page.title %}{{ page.title }}{% else %}DevLabStudy | PCHub{% endif %}</title>
    
    <!-- FAVICON Z ASSETS/IMG/LOGO.PNG -->
    <link rel="icon" type="image/png" href="/assets/img/logo.png">
    <link rel="shortcut icon" type="image/png" href="/assets/img/logo.png">
    <link rel="apple-touch-icon" href="/assets/img/logo.png">

    <!-- CZCIONKI -->
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700;800;900&family=Inter:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-base: #0a0a0c;
            --text-main: #f1f5f9;
            --text-muted: #8b9bb4;
            --accent-orange: #ff9900;
            --border-subtle: #2a2a2a;
            --font-mono: 'JetBrains Mono', monospace;
            --font-sans: 'Inter', sans-serif;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg-base);
            color: var(--text-main);
            font-family: var(--font-sans);
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            width: 100%;
            max-width: 1250px;
            margin: 0 auto;
            padding: 1.2rem 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-subtle);
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
        }

        .logo-img {
            width: 28px;
            height: 28px;
            object-fit: contain;
        }

        .logo-text {
            font-family: var(--font-mono);
            font-weight: 900;
            font-size: 1.1rem;
            color: #fff;
            text-transform: uppercase;
        }

        .logo-text span { color: var(--accent-orange); }

        nav { display: flex; gap: 1.2rem; }

        nav a {
            color: var(--text-muted);
            text-decoration: none;
            font-family: var(--font-mono);
            font-size: 0.8rem;
            font-weight: 700;
            transition: color 0.2s;
        }

        nav a:hover { color: var(--accent-orange); }

        main {
            flex: 1;
            width: 100%;
            max-width: 1250px;
            margin: 0 auto;
            padding: 2rem 1.5rem;
        }

        footer {
            border-top: 1px solid var(--border-subtle);
            padding: 2rem 1.5rem;
            text-align: center;
            font-family: var(--font-mono);
            font-size: 0.75rem;
            color: var(--text-muted);
            background: #050507;
            margin-top: auto;
        }
    </style>

    {% if page.custom_css %}
        <link rel="stylesheet" href="{{ page.custom_css }}">
    {% endif %}
</head>
<body>

    <header>
        <a href="/" class="logo-container">
            <img src="/assets/img/logo.png" alt="DevLabStudy Logo" class="logo-img">
            <span class="logo-text">DevLab<span>Study</span></span>
        </a>
        <nav>
            <a href="/">Główna</a>
            <a href="/pchub/">PCHub</a>
            <a href="/testy/komputery/">Testy PC</a>
            <a href="/testy/homelab/">Homelab</a>
        </nav>
    </header>

    <main>
        {{ content }}
    </main>

    <footer>
        <p>&copy; {{ 'now' | date: "%Y" }} DevLabStudy &bull; Hardware &amp; Homelab Repository</p>
    </footer>

</body>
</html>
