<!-- Skrypt inicjalizujący Baner CookieConsent -->
<script>
  window.addEventListener('load', function () {
    var cc = initCookieConsent();

    cc.run({
      current_lang: 'pl',
      autoclear_cookies: true,
      page_scripts: true,

      gui_options: {
        consent_modal: {
          layout: 'cloud',
          position: 'bottom center',
          transition: 'slide',
          swap_buttons: false
        }
      },

      languages: {
        'pl': {
          consent_modal: {
            title: 'Strona używa plików cookie 🍪',
            description: 'Używamy plików cookie w celu prawidłowego działania witryny oraz multimediów. Więcej dowiesz się w naszej <a href="https://devlabstudy.ovh/polityka-prywatnosci">Polityce Prywatności</a>.',
            primary_btn: {
              text: 'Akceptuję',
              role: 'accept_all'
            },
            secondary_btn: {
              text: 'Tylko niezbędne',
              role: 'accept_necessary'
            }
          }
        }
      }
    });
  });
</script>
